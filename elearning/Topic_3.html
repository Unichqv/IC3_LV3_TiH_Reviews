    }


    /* =========================================================
       BẮT ĐẦU BÀI THI
    ========================================================= */

    function startExam() {

      state.screen =
        "playing";

      state.index =
        0;

      state.lives =
        3;

      state.score =
        0;

      state.correct =
        0;

      state.attemptNumber =
        null;

      state.answered =
        false;


      activeQuestions =
        SHUFFLE_QUESTIONS

          ? shuffleArray(
              quiz.questions
            )

          : [...quiz.questions];


      activeQuestions =
        activeQuestions.map(
          shuffleQuestionAnswers
        );


      trueFalseChoices =
        SHUFFLE_TRUE_FALSE

          ? shuffleArray([
              true,
              false
            ])

          : [
              true,
              false
            ];


      prepareQuestion();

      render();

    }


    /* =========================================================
       CHUẨN BỊ CÂU HỎI
    ========================================================= */

    function prepareQuestion() {

      state.answered =
        false;

      state.answerCorrect =
        null;

      state.selected =
        null;

      state.multi =
        [];

      state.blank =
        "";

      state.binary =
        {};

      state.matches =
        {};

      state.selectedLeft =
        null;

      state.matchingRights =
        [];

      state.order =
        [];


      const q =
        activeQuestions[
          state.index
        ];


      /* Matching */

      if (
        q.type === "matching"
      ) {

        state.matchingRights =
          shuffleArray(
            q.pairs.map(
              pair => pair[1]
            )
          );

      }


      /* Process order */

      if (
        q.type === "process-order"
        &&
        q.steps
      ) {

        state.order =
          shuffleArray(
            q.steps.map(
              (_, i) => i
            )
          );

      }

    }


    /* =========================================================
       CHẤM ĐÁP ÁN
    ========================================================= */

    function answer(correct) {

      if (
        state.answered
      ) {
        return;
      }


      state.answered =
        true;


      state.answerCorrect =
        correct;


      if (correct) {

        state.correct++;


        state.score +=
          100 +
          (
            state.correct > 1
              ? state.correct * 15
              : 0
          );

      }

      else {

        state.lives =
          Math.max(
            0,
            state.lives - 1
          );

      }


      render();

    }


    /* =========================================================
       CÂU TIẾP THEO
    ========================================================= */

    function next() {

      if (
        state.lives <= 0
      ) {

        saveResult();

        state.screen =
          "failed";

        render();

        return;
      }


      if (
        state.index + 1 >=
        activeQuestions.length
      ) {

        saveResult();

        state.screen =
          "result";

        render();

        return;
      }


      state.index++;

      prepareQuestion();

      render();

    }


    /* =========================================================
       RENDER CÂU HỎI
    ========================================================= */

    function renderExam() {

      const q =
        activeQuestions[
          state.index
        ];


      let bodyHTML = "";


      /* -----------------------------------------
         MULTIPLE CHOICE
      ----------------------------------------- */

      if (
        q.type === "multiple-choice"
      ) {

        bodyHTML = `

          <div class="options-grid">

            ${q.options.map(
              (opt, idx) => {

                let cls =
                  "option-btn";


                if (
                  state.answered
                ) {

                  if (
                    idx === q.correct
                  ) {

                    cls +=
                      " correct";

                  }

                  else if (
                    idx === state.selected
                  ) {

                    cls +=
                      " wrong";

                  }

                }


                return `

                  <button
                    class="${cls}"
                    ${state.answered ? "disabled" : ""}
                    data-i="${idx}"
                  >

                    <span
                      class="option-letter"
                    >
                      ${String.fromCharCode(65 + idx)}
                    </span>

                    <span>
                      ${opt}
                    </span>

                  </button>

                `;

              }
            ).join("")}

          </div>

        `;

      }


      /* -----------------------------------------
         RADIO
      ----------------------------------------- */

      else if (
        q.type === "radio"
      ) {

        bodyHTML = `

          <div class="radio-list">

            ${q.options.map(
              (opt, idx) => {

                let cls =
                  "radio-choice";


                if (
                  state.answered &&
                  idx === q.correct
                ) {

                  cls +=
                    " correct";

                }

                else if (
                  state.answered &&
                  idx === state.selected
                ) {

                  cls +=
                    " wrong";

                }


                return `

                  <label
                    class="${cls}"
                  >

                    <input
                      type="radio"
                      name="radioAnswer"
                      value="${idx}"
                      ${state.selected === idx ? "checked" : ""}
                      ${state.answered ? "disabled" : ""}
                      data-radio="${idx}"
                    >

                    <span>
                      ${opt}
                    </span>

                  </label>

                `;

              }
            ).join("")}

          </div>

        `;

      }


      /* -----------------------------------------
         VISUAL
      ----------------------------------------- */

      else if (
        q.type === "visual-choice"
      ) {

        bodyHTML = `

          <div class="visual-grid">

            ${q.options.map(
              (opt, idx) => {

                let cls =
                  "visual-choice";


                if (
                  state.selected === idx
                ) {

                  cls +=
                    " selected";

                }


                if (
                  state.answered &&
                  idx === q.correct
                ) {

                  cls +=
                    " correct";

                }

                else if (
                  state.answered &&
                  idx === state.selected
                ) {

                  cls +=
                    " wrong";

                }


                return `

                  <button
                    class="${cls}"
                    ${state.answered ? "disabled" : ""}
                    data-visual="${idx}"
                  >

                    <span
                      class="visual-icon"
                      aria-hidden="true"
                    >
                      ${q.icons[idx]}
                    </span>

                    <span>
                      ${opt}
                    </span>

                  </button>

                `;

              }
            ).join("")}

          </div>

        `;

      }


      /* -----------------------------------------
         FILL BLANK
      ----------------------------------------- */

      else if (
        q.type === "fill-in-blank"
      ) {

        bodyHTML = `

          <div class="fill-blank-form">

            <input
              id="blankAnswer"
              type="text"
              placeholder="Nhập câu trả lời..."
              ${state.answered ? "disabled" : ""}
              autocomplete="off"
              value="${state.blank}"
            >

            ${
              !state.answered

                ? `

                  <button
                    class="btn btn-primary"
                    id="submitBlank"
                    style="width:auto;margin-top:0;"
                    ${state.blank.trim() ? "" : "disabled"}
                  >
                    Trả lời
                  </button>

                `

                : ""
            }

          </div>

        `;

      }


      /* -----------------------------------------
         MULTIPLE SELECT
      ----------------------------------------- */

      else if (
        q.type === "multiple-select"
      ) {

        bodyHTML = `

          <div class="choice-list">

            ${q.options.map(
              (opt, idx) => `

                <label
                  class="choice-btn ${
                    state.multi.includes(idx)
                      ? "selected"
                      : ""
                  }"
                >

                  <input
                    type="checkbox"
                    data-multi="${idx}"
                    ${
                      state.multi.includes(idx)
                        ? "checked"
                        : ""
                    }
                    ${
                      state.answered
                        ? "disabled"
                        : ""
                    }
                  >

                  <span>
                    ${opt}
                  </span>

                </label>

              `
            ).join("")}

          </div>


          ${
            !state.answered

              ? `

                <button
                  class="btn btn-primary"
                  id="submitMulti"
                  style="margin-top:14px;"
                  ${
                    state.multi.length === 0
                      ? "disabled"
                      : ""
                  }
                >
                  Xác Nhận Đáp Án
                </button>

              `

              : ""
          }

        `;

      }


      /* -----------------------------------------
         MATCHING
      ----------------------------------------- */

      else if (
        q.type === "matching"
      ) {

        const rights =
          state.matchingRights;


        bodyHTML = `

          <div class="matching-grid">

            <div class="matching-col">

              <h4>
                Cột A - Khái Niệm
              </h4>

              ${q.pairs.map(
                (pair, idx) => `

                  <button
                    class="
                      matching-item
                      ${
                        state.selectedLeft === pair[0]
                          ? "active"
                          : ""
                      }
                      ${
                        state.matches[pair[0]]
                          ? "paired"
                          : ""
                      }
                    "
                    ${
                      state.answered
                        ? "disabled"
                        : ""
                    }
                    data-left="${idx}"
                  >
                    ${pair[0]}
                  </button>

                `
              ).join("")}

            </div>


            <div class="matching-col">

              <h4>
                Cột B - Mô Tả/Chức Năng
              </h4>

              ${rights.map(
                (right, idx) => `

                  <button
                    class="matching-item ${
                      state.matches[
                        state.selectedLeft
                      ] === right
                        ? "paired"
                        : ""
                    }"
                    ${
                      state.answered ||
                      !state.selectedLeft
                        ? "disabled"
                        : ""
                    }
                    data-right="${idx}"
                  >
                    ${right}
                  </button>

                `
              ).join("")}

            </div>

          </div>


          ${
            !state.answered

              ? `

                <button
                  class="btn btn-primary"
                  id="submitMatch"
                  style="margin-top:14px;"
                  ${
                    Object.keys(
                      state.matches
                    ).length !== q.pairs.length
                      ? "disabled"
                      : ""
                  }
                >
                  Xác Nhận Ghép Nối
                </button>

              `

              : ""
          }

        `;

      }


      /* -----------------------------------------
         BINARY
      ----------------------------------------- */

      else if (
        q.type === "binary"
      ) {

        bodyHTML = `

          <div class="binary-items">

            ${q.items.map(
              (item, idx) => `

                <div class="binary-item">

                  <span
                    style="flex:1;"
                  >
                    ${idx + 1}.
                    ${item[0]}
                  </span>

                  <div class="binary-buttons">

                    ${trueFalseChoices.map(
                      value => `

                        <button
                          class="
                            binary-btn
                            ${
                              value
                                ? "yes"
                                : "no"
                            }
                            ${
                              state.binary[idx] === value
                                ? "active"
                                : ""
                            }
                          "
                          ${
                            state.answered
                              ? "disabled"
                              : ""
                          }
                          data-bin="${idx}:${value}"
                        >
                          ${
                            value
                              ? "Đúng"
                              : "Sai"
                          }
                        </button>

                      `
                    ).join("")}

                  </div>

                </div>

              `
            ).join("")}

          </div>


          ${
            !state.answered

              ? `

                <button
                  class="btn btn-primary"
                  id="submitBin"
                  style="margin-top:14px;"
                  ${
                    Object.keys(
                      state.binary
                    ).length !== q.items.length
                      ? "disabled"
                      : ""
                  }
                >
                  Xác Nhận Đánh Giá
                </button>

              `

              : ""
          }

        `;

      }


      /* -----------------------------------------
         PROCESS ORDER
      ----------------------------------------- */

      else if (
        q.type === "process-order"
      ) {

        bodyHTML = `

          <div class="order-items">

            ${state.order.map(
              (stepIdx, pos) => `

                <div class="order-item">

                  <div class="order-step">

                    <span
                      class="order-number"
                    >
                      ${pos + 1}
                    </span>

                    <span>
                      ${q.steps[stepIdx]}
                    </span>

                  </div>


                  ${
                    !state.answered

                      ? `

                        <div class="order-buttons">

                          <button
                            class="order-btn"
                            ${
                              pos === 0
                                ? "disabled"
                                : ""
                            }
                            data-up="${pos}"
                          >
                            ⬆️
                          </button>

                          <button
                            class="order-btn"
                            ${
                              pos === state.order.length - 1
                                ? "disabled"
                                : ""
                            }
                            data-down="${pos}"
                          >
                            ⬇️
                          </button>

                        </div>

                      `

                      : ""
                  }

                </div>

              `
            ).join("")}

          </div>


          ${
            !state.answered

              ? `

                <button
                  class="btn btn-primary"
                  id="submitOrder"
                  style="margin-top:14px;"
                >
                  Xác Nhận Thứ Tự
                </button>

              `

              : ""
          }

        `;

      }


      /* =========================================================
         HTML MÀN HÌNH
      ========================================================= */

      app.innerHTML = `

        <div class="app">

          <div class="container">

            <div class="card">

              <div class="hud">

                <div class="hud-stats">

                  <span class="stat-badge life">
                    ❤️ ${state.lives}
                  </span>

                  <span class="stat-badge score">
                    ⭐ ${state.score}
                  </span>

                  ${
                    state.correct >= 2

                      ? `

                        <span class="stat-badge combo">
                          🔥 x${state.correct}
                        </span>

                      `

                      : ""
                  }

                </div>


                <div
                  style="font-weight:700;color:#667eea;"
                >
                  Câu
                  ${state.index + 1}
                  /
                  ${activeQuestions.length}
                </div>

              </div>


              <div class="progress-bar">

                <div
                  style="
                    width:${
                      (
                        (state.index + 1) /
                        activeQuestions.length
                      ) * 100
                    }%;
                  "
                ></div>

              </div>

            </div>


            <div
              class="card"
              style="margin-top:16px;"
            >

              <div class="question-card">

                <div>

                  <div class="question-header">

                    <div class="question-category">
                      ${q.category}
                    </div>

                    <h2 class="question-text">
                      ${q.text}
                    </h2>

                  </div>


                  <div class="question-body">

                    ${bodyHTML}

                  </div>

                </div>


                ${
                  state.answered

                    ? `

                      <div
                        class="feedback-overlay"
                      >

                        <div>

                          <div
                            class="
                              feedback-status
                              ${
                                state.answerCorrect
                                  ? "correct"
                                  : "wrong"
                              }
                            "
                          >

                            ${
                              state.answerCorrect

                                ? "🎉 Chính xác! Xuất sắc lắm!"

                                : "💡 Chưa đúng, cố gắng tiếp nhé!"
                            }

                          </div>


                          ${
                            q.type === "fill-in-blank" &&
                            !state.answerCorrect

                              ? `

                                <div
                                  class="feedback-explain"
                                >
                                  Đáp án:
                                  ${q.answers[0]}
                                </div>

                              `

                              : ""
                          }


                          ${
                            q.explain

                              ? `

                                <div
                                  class="feedback-explain"
                                >
                                  Giải thích: 
                                  ${q.explain}
                                </div>

                              `

                              : ""
                          }

                        </div>


                        <button
                          class="btn-next"
                          id="nextBtn"
                        >
                          Câu Tiếp Theo
                        </button>

                      </div>

                    `

                    : ""
                }

              </div>

            </div>

          </div>

        </div>

      `;


      bindExam(q);

    }


    /* =========================================================
       GẮN SỰ KIỆN CÂU HỎI
    ========================================================= */

    function bindExam(q) {


      /* -----------------------------------------
         Multiple choice
      ----------------------------------------- */

      document
        .querySelectorAll("[data-i]")
        .forEach(btn => {

          btn.onclick = () => {

            state.selected =
              Number(
                btn.dataset.i
              );

            answer(
              state.selected ===
              q.correct
            );

          };

        });


      /* -----------------------------------------
         Radio + Visual
      ----------------------------------------- */

      document
        .querySelectorAll(
          "[data-radio], [data-visual]"
        )
        .forEach(choice => {

          choice.onclick = () => {

            state.selected =
              Number(
                choice.dataset.radio ??
                choice.dataset.visual
              );

            answer(
              state.selected ===
              q.correct
            );

          };

        });


      /* -----------------------------------------
         Fill blank
      ----------------------------------------- */

      const blankInput =
        document.getElementById(
          "blankAnswer"
        );


      const submitBlank =
        document.getElementById(
          "submitBlank"
        );


      if (
        blankInput &&
        submitBlank
      ) {

        blankInput.oninput = () => {

          state.blank =
            blankInput.value;

          submitBlank.disabled =
            !state.blank.trim();

        };


        submitBlank.onclick = () => {

          const normalize =
            value =>

              String(value)
                .normalize("NFD")
                .replace(
                  /[\u0300-\u036f]/g,
                  ""
                )
                .replace(
                  /đ/g,
                  "d"
                )
                .replace(
                  /Đ/g,
                  "D"
                )
                .toLocaleLowerCase("vi")
                .trim()
                .replace(
                  /\s+/g,
                  " "
                );


          const userAnswer =
            normalize(
              blankInput.value
            );


          answer(
            q.answers.some(
              item =>
                normalize(item) ===
                userAnswer
            )
          );

        };

      }


      /* -----------------------------------------
         Multiple select
      ----------------------------------------- */

      document
        .querySelectorAll(
          "[data-multi]"
        )
        .forEach(input => {

          input.onchange = () => {

            const idx =
              Number(
                input.dataset.multi
              );


            state.multi =
              input.checked

                ? [
                    ...state.multi,
                    idx
                  ]

                : state.multi.filter(
                    x => x !== idx
                  );


            render();

          };

        });


      const submitMulti =
        document.getElementById(
          "submitMulti"
        );


      if (submitMulti) {

        submitMulti.onclick = () => {

          const userSorted =
            [...state.multi]
              .sort()
              .join(",");


          const correctSorted =
            [...q.multipleCorrect]
              .sort()
              .join(",");


          answer(
            userSorted ===
            correctSorted
          );

        };

      }


      /* -----------------------------------------
         Matching
      ----------------------------------------- */

      document
        .querySelectorAll(
          "[data-left]"
        )
        .forEach(btn => {

          btn.onclick = () => {

            state.selectedLeft =
              q.pairs[
                Number(
                  btn.dataset.left
                )
              ][0];

            render();

          };

        });


      document
        .querySelectorAll(
          "[data-right]"
        )
        .forEach(btn => {

          btn.onclick = () => {

            if (
              !state.selectedLeft
            ) {
              return;
            }


            state.matches[
              state.selectedLeft
            ] =
              state.matchingRights[
                Number(
                  btn.dataset.right
                )
              ];


            state.selectedLeft =
              null;


            render();

          };

        });


      const submitMatch =
        document.getElementById(
          "submitMatch"
        );


      if (submitMatch) {

        submitMatch.onclick = () => {

          const isCorrect =
            q.pairs.every(
              pair =>
                state.matches[
                  pair[0]
                ] === pair[1]
            );


          answer(
            isCorrect
          );

        };

      }


      /* -----------------------------------------
         Binary
      ----------------------------------------- */

      document
        .querySelectorAll(
          "[data-bin]"
        )
        .forEach(btn => {

          btn.onclick = () => {

            const [
              idx,
              val
            ] =
              btn.dataset.bin.split(":");


            state.binary[idx] =
              val === "true";


            render();

          };

        });


      const submitBin =
        document.getElementById(
          "submitBin"
        );


      if (submitBin) {

        submitBin.onclick = () => {

          const isCorrect =
            q.items.every(
              (item, idx) =>
                state.binary[idx] ===
                item[1]
            );


          answer(
            isCorrect
          );

        };

      }


      /* -----------------------------------------
         Order
      ----------------------------------------- */

      document
        .querySelectorAll(
          "[data-up]"
        )
        .forEach(btn => {

          btn.onclick = () => {

            moveOrder(
              Number(
                btn.dataset.up
              ),
              -1
            );

          };

        });


      document
        .querySelectorAll(
          "[data-down]"
        )
        .forEach(btn => {

          btn.onclick = () => {

            moveOrder(
              Number(
                btn.dataset.down
              ),
              1
            );

          };

        });


      const submitOrder =
        document.getElementById(
          "submitOrder"
        );


      if (submitOrder) {

        submitOrder.onclick = () => {

          const isCorrect =
            state.order.every(
              (val, idx) =>
                val === q.correct[idx]
            );


          answer(
            isCorrect
          );

        };

      }


      /* -----------------------------------------
         Next
      ----------------------------------------- */

      const nextBtn =
        document.getElementById(
          "nextBtn"
        );


      if (nextBtn) {

        nextBtn.onclick =
          next;

      }

    }


    /* =========================================================
       DI CHUYỂN THỨ TỰ
    ========================================================= */

    function moveOrder(
      pos,
      dir
    ) {

      const temp =
        state.order[pos];


      state.order[pos] =
        state.order[
          pos + dir
        ];


      state.order[
        pos + dir
      ] =
        temp;


      render();

    }


    /* =========================================================
       LƯU KẾT QUẢ
    ========================================================= */

    function saveResult() {

      const score10 =
        Number(
          (
            state.correct /
            activeQuestions.length *
            10
          ).toFixed(1)
        );


      const submittedAt =
        new Date().toISOString();


      const payload = {

        fullName:
          state.name,

        className:
          state.className,

        examTitle:
          quiz.title,

        score:
          score10,

        correctAnswers:
          state.correct,

        wrongAnswers:
          activeQuestions.length -
          state.correct,

        submittedAt

      };


      /* =====================================================
         LOCAL STORAGE
      ===================================================== */

      const KEY =
        "tinHocStudentData_v1";


      let db;


      try {

        db =
          JSON.parse(
            localStorage.getItem(
              KEY
            ) || "null"
          );

      } catch (error) {

        console.error(
          "Dữ liệu localStorage bị lỗi:",
          error
        );

        db = null;

      }


      /* -----------------------------------------
         Tạo database mới
      ----------------------------------------- */

      if (
        !db ||
        typeof db !== "object"
      ) {

        db = {

          version: "1.0",

          classInfo: {

            /*
             * SỬA QUAN TRỌNG:
             * Không còn "Lớp Năm 1".
             * Lấy trực tiếp lớp đang chọn.
             */

            name:
              state.className ||
              "Năm 5",

            grade: 5,

            description:
              "Lớp Tin học nâng cao khối 5"

          },

          students: []

        };

      }


      /* -----------------------------------------
         Đảm bảo students luôn là array
      ----------------------------------------- */

      if (
        !Array.isArray(
          db.students
        )
      ) {

        db.students = [];

      }


      /* -----------------------------------------
         Cập nhật classInfo
      ----------------------------------------- */

      db.classInfo = {

        ...(db.classInfo || {}),

        name:
          normalizeClassName(
            state.className
          ) || "Năm 5",

        grade: 5,

        description:
          "Lớp Tin học nâng cao khối 5"

      };


      /* -----------------------------------------
         Tìm học sinh theo:
         Họ tên + Lớp
      ----------------------------------------- */

      let student =
        db.students.find(
          s =>

            s.fullName ===
              state.name

            &&

            normalizeClassName(
              s.className
            ) ===
              normalizeClassName(
                state.className
              )
        );


      /* -----------------------------------------
         Nếu chưa có học sinh
         -> tạo mới
      ----------------------------------------- */

      if (!student) {

        student = {

          studentId:
            "HS" +
            String(
              Date.now()
            ).slice(-6),

          fullName:
            state.name,

          className:
            normalizeClassName(
              state.className
            ) || "Năm 5",

          grade: 5,

          gender:
            state.gender,

          exams: []

        };


        db.students.push(
          student
        );

      }


      /* -----------------------------------------
         Đảm bảo exams tồn tại
      ----------------------------------------- */

      if (
        !Array.isArray(
          student.exams
        )
      ) {

        student.exams = [];

      }


      /* -----------------------------------------
         Tìm bài thi
      ----------------------------------------- */

      let exam =
        student.exams.find(
          e =>
            e.examTitle ===
            quiz.title
        );


      /* -----------------------------------------
         Nếu chưa có bài thi
      ----------------------------------------- */

      if (!exam) {

        exam = {

          examTitle:
            quiz.title,

          attempts: []

        };


        student.exams.push(
          exam
        );

      }


      /* -----------------------------------------
         Đảm bảo attempts
      ----------------------------------------- */

      if (
        !Array.isArray(
          exam.attempts
        )
      ) {

        exam.attempts = [];

      }


      /* -----------------------------------------
         Tính lần làm
      ----------------------------------------- */

      state.attemptNumber =
        exam.attempts.length + 1;


      /* -----------------------------------------
         Lưu lần làm
      ----------------------------------------- */

      exam.attempts.push({

        attemptNumber:
          state.attemptNumber,

        examTitle:
          quiz.title,

        score:
          score10,

        correctAnswers:
          state.correct,

        wrongAnswers:
          activeQuestions.length -
          state.correct,

        submittedAt

      });


      /* -----------------------------------------
         Ghi localStorage
      ----------------------------------------- */

      try {

        localStorage.setItem(
          KEY,
          JSON.stringify(db)
        );

      } catch (error) {

        console.error(
          "Không thể lưu kết quả:",
          error
        );

      }


      /* =====================================================
         GỬI GOOGLE APPS SCRIPT
      ===================================================== */

      payload.attemptNumber =
        state.attemptNumber;


      if (
        SCRIPT_URL &&
        !SCRIPT_URL.includes(
          "DÁN_LINK"
        )
      ) {

        fetch(
          SCRIPT_URL,
          {

            method: "POST",

            mode: "no-cors",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                payload
              )

          }
        )
        .catch(
          error =>
            console.error(
              "Lỗi gửi Google Apps Script:",
              error
            )
        );

      }

    }


    /* =========================================================
       KẾT QUẢ
    ========================================================= */

    function renderResult() {

      const score10 =
        (
          state.correct /
          activeQuestions.length *
          10
        ).toFixed(1);


            app.innerHTML = `
                < div class="app" >
                    <div class="container">
                        <div class="card">
                            <div class="hud">
                                <div class="hud-stats">
                                    <span class="stat-badge life">❤️ ${state.lives}</span>
                                    <span class="stat-badge score">⭐ ${state.score}</span>
                                    ${state.correct >= 2 ? `<span class="stat-badge combo">🔥 x${state.correct}</span>` : ""}
                                </div>
                                <div style="font-weight:700;color:#667eea;">
                                    Câu ${state.index + 1} / ${activeQuestions.length}
                                </div>
                            </div>
                            <div class="progress-bar">
                                <div style="width:${((state.index + 1) / activeQuestions.length) * 100}%;"></div>
                            </div>
                        </div>

                        <div class="card" style="margin-top:16px;">
                            <div class="question-card">
                                <div>
                                    <div class="question-header">
                                        <div class="question-category">${q.category}</div>
                                        <h2 class="question-text">${q.text}</h2>
                                    </div>
                                    <div class="question-body">
                                        ${bodyHTML}
                                    </div>
                                </div>

                                ${state.answered ? `
                  <div class="feedback-overlay">
                    <div>
                      <div class="feedback-status ${state.answerCorrect ? "correct" : "wrong"}">
                        ${state.answerCorrect ? "🎉 Chính xác! Xuất sắc lắm!" : "💡 Chưa đúng rồi, cùng xem lại đáp án nhé!"}
                      </div>

                      ${!state.answerCorrect ? `
                        <div class="feedback-correct-ans">
                          📌 <strong>Đáp án chính xác:</strong> ${getCorrectAnswerText(q)}
                        </div>
                      ` : ""}

                      ${q.explain ? `
                        <div class="feedback-explain">
                          💡 <strong>Giải thích chi tiết:</strong><br>${q.explain}
                        </div>
                      ` : ""}
                    </div>

                    <button class="btn-next" id="nextBtn">
                      Câu Tiếp Theo →
                    </button>
                  </div>
                ` : ""}
                            </div>
                        </div>
                    </div>
        </div >
                `;

      document
        .getElementById("again")
        .onclick =
          () => startExam();


      document
        .getElementById("home")
        .onclick =
          () => {

            state.screen =
              "intro";

            render();

          };

    }


    /* =========================================================
       HẾT MẠNG
    ========================================================= */

    function renderFailed() {

      app.innerHTML = `

        <div class="app">

          <div class="container">

            <div
              class="card result-card"
            >

              <div class="trophy">
                💔
              </div>

              <div
                class="badge"
                style="
                  background:#ffebee;
                  color:#c62828;
                "
              >
                ⚠️ HẾT 3 TRÁI TIM SINH MỆNH
              </div>

              <h1>
                Tiếc quá
                ${state.name}!
              </h1>

              <p
                style="
                  color:#555;
                  font-size:14px;
                "
              >
                Lần làm bài thứ
                ${state.attemptNumber}.
                Bạn đã hết mạng sống.
                Các bạn có muốn thử lại không?
              </p>


              <div class="result-actions">

                <button
                  class="btn btn-primary"
                  id="retry"
                >
                  Thử Lại
                </button>

                <button
                  class="btn"
                  style="
                    background:#f0f0f0;
                    color:#333;
                    border:none;
                  "
                  id="failedHome"
                >
                  Trang Chủ
                </button>

              </div>

            </div>

          </div>

        </div>

      `;


      document
        .getElementById("retry")
        .onclick =
          () => startExam();


      document
        .getElementById("failedHome")
        .onclick =
          () => {

            state.screen =
              "intro";

            render();

          };

    }


    /* =========================================================
       KHỞI ĐỘNG
    ========================================================= */

    render();

  </script>
