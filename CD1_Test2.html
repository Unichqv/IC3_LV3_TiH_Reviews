<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Tin Học 5 - Test 2: IC3 Spark & Gen AI</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            background: #eef2ff;
            padding: 12px 20px;
            border-radius: 10px;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .question-card {
            display: none;
        }

        .question-card.active {
            display: block;
        }

        .category {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #6b7280;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .btn-option {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            padding: 14px 18px;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-option:hover {
            border-color: var(--primary);
            background: #eef2ff;
        }

        .btn-option.correct {
            background: #d1fae5 !important;
            border-color: var(--success) !important;
            color: #065f46;
        }

        .btn-option.incorrect {
            background: #fee2e2 !important;
            border-color: var(--error) !important;
            color: #991b1b;
        }

        /* Image Click Question (Câu 7) */
        .image-container {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 700px;
            margin-top: 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            display: block;
        }

        .hotspot {
            position: absolute;
            border: 3px dashed transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .hotspot:hover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.2);
        }

        .hotspot.selected-correct {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.3);
        }

        .hotspot.selected-wrong {
            border-color: var(--error);
            background: rgba(239, 68, 68, 0.3);
        }

        /* Binary Table Question */
        .binary-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .binary-table th, .binary-table td {
            border: 1px solid #e5e7eb;
            padding: 10px;
            text-align: left;
        }

        .binary-table th {
            background: #f3f4f6;
        }

        .btn-binary {
            padding: 6px 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            cursor: pointer;
            margin-right: 5px;
        }

        .btn-binary.active-yes { background: var(--success); color: white; border-color: var(--success); }
        .btn-binary.active-no { background: var(--error); color: white; border-color: var(--error); }

        .explanation {
            margin-top: 20px;
            padding: 15px;
            background: #fffbe0;
            border-left: 4px solid #f59e0b;
            border-radius: 6px;
            display: none;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-next {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            display: none;
        }

        .btn-next:hover { background: var(--primary-hover); }

        .result-screen {
            text-align: center;
            display: none;
        }
    </style>
</head>

let currentIdx = 0;
let score = 0;
let userAnswers = {};

function initQuiz() {
    renderQuestion();
}

function renderQuestion() {
    const q = questionBank[currentIdx];
    document.getElementById("currentQ").innerText = currentIdx + 1;
    document.getElementById("explanationBox").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";

    let html = `
        <div class="question-card active">
            <div class="category">${q.category}</div>
            <div class="question-text">${q.text}</div>
    `;

    if (q.type === "binary") {
        html += `<table class="binary-table"><tr><th>Nội dung</th><th>Đánh giá</th></tr>`;
        q.items.forEach((item, idx) => {
            html += `
                <tr>
                    <td>${item.label}</td>
                    <td>
                        <button class="btn-binary" id="bin_yes_${idx}" onclick="selectBinary(${idx}, true)">CÓ</button>
                        <button class="btn-binary" id="bin_no_${idx}" onclick="selectBinary(${idx}, false)">KHÔNG</button>
                    </td>
                </tr>
            `;
        });
        html += `</table><button class="btn-next" style="display:inline-block; margin-top:10px;" onclick="checkBinary()">Xác nhận đáp án</button>`;
    } else if (q.type === "image-click") {
        html += `
            <div class="image-container">
                <img src="${q.imageSrc}" alt="Giao diện Google">
                <div class="hotspot" style="top:${q.hotspot.top}%; left:${q.hotspot.left}%; width:${q.hotspot.width}%; height:${q.hotspot.height}%;" onclick="checkImageClick(true, this)"></div>
            </div>
            <p style="font-size:0.9rem; color:#6b7280; margin-top:5px;"><i>(Hãy nhấp trực tiếp vào ô Thanh địa chỉ ở phía trên bức ảnh)</i></p>
        `;
    } else {
        html += `<div class="options-grid">`;
        q.options.forEach((opt, idx) => {
            html += `<button class="btn-option" onclick="checkMultipleChoice(${idx}, this)">${String.fromCharCode(65 + idx)}. ${opt}</button>`;
        });
        html += `</div>`;
    }

    html += `</div>`;
    document.getElementById("quizBox").innerHTML = html;
}

function checkMultipleChoice(selectedIdx, btn) {
    const q = questionBank[currentIdx];
    const buttons = document.querySelectorAll(".btn-option");
    buttons.forEach(b => b.disabled = true);

    if (selectedIdx === q.correct) {
        btn.classList.add("correct");
        score += 10;
    } else {
        btn.classList.add("incorrect");
        buttons[q.correct].classList.add("correct");
    }

    showExplanation(q.explain);
}

let binaryResponses = {};
function selectBinary(itemIdx, val) {
    binaryResponses[itemIdx] = val;
    document.getElementById(`bin_yes_${itemIdx}`).className = val ? "btn-binary active-yes" : "btn-binary";
    document.getElementById(`bin_no_${itemIdx}`).className = !val ? "btn-binary active-no" : "btn-binary";
}

function checkBinary() {
    const q = questionBank[currentIdx];
    if (Object.keys(binaryResponses).length < q.items.length) {
        alert("Em hãy chọn CÓ hoặc KHÔNG cho tất cả các ý nhé!");
        return;
    }

    let isAllCorrect = true;
    q.items.forEach((item, idx) => {
        if (binaryResponses[idx] !== item.correct) isAllCorrect = false;
    });

    if (isAllCorrect) score += 10;
    showExplanation(q.explain);
}

function checkImageClick(isCorrect, element) {
    if (isCorrect) {
        element.classList.add("selected-correct");
        score += 10;
    } else {
        element.classList.add("selected-wrong");
    }
    showExplanation(questionBank[currentIdx].explain);
}

function showExplanation(text) {
    document.getElementById("score").innerText = score;
    const expBox = document.getElementById("explanationBox");
    expBox.innerHTML = `<strong>💡 Giải thích đáp án:</strong> ${text}`;
    expBox.style.display = "block";
    document.getElementById("nextBtn").style.display = "inline-block";
}

function nextQuestion() {
    binaryResponses = {};
    currentIdx++;
    if (currentIdx < questionBank.length) {
        renderQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quizBox").style.display = "none";
    document.getElementById("statsBar").style.display = "none";
    document.getElementById("explanationBox").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("resultScreen").style.display = "block";
    document.getElementById("finalScore").innerText = score;
}

window.onload = initQuiz;
</script>
