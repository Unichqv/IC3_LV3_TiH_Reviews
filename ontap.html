<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hành Trình Chinh Phục Kiến Thức</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #10b981;
      --error: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 700px; background: var(--card-bg); padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

    /* --- GIAO DIỆN HỌ TÊN VÀ LỚP (USER INFO) --- */
    .user-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #6366f1, var(--primary));
      color: white;
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .user-info h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
    .user-info p { font-size: 0.9rem; opacity: 0.9; }
    .score-badge { background: rgba(255,255,255,0.2); padding: 8px 14px; border-radius: 20px; font-weight: bold; }

    /* --- GIAO DIỆN HÀNH TRÌNH (ROADMAP PROGRESS) --- */
    .roadmap { display: flex; justify-content: space-between; position: relative; margin: 20px 0 30px 0; }
    .roadmap::before {
      content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 4px;
      background: #e2e8f0; transform: translateY(-50%); z-index: 1;
    }
    .step {
      width: 36px; height: 36px; border-radius: 50%; background: #e2e8f0; color: #64748b;
      display: flex; align-items: center; justify-content: center; font-weight: bold;
      position: relative; z-index: 2; transition: all 0.3s;
    }
    .step.active { background: var(--primary); color: white; box-shadow: 0 0 0 4px #c7d2fe; }
    .step.completed { background: var(--success); color: white; }

    /* --- KHUNG CÂU HỎI VÀ ĐÁP ÁN --- */
    .question-title { font-size: 1.1rem; margin-bottom: 16px; font-weight: 600; line-height: 1.5; }
    .options-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    
    .option-btn {
      padding: 14px 18px; border: 2px solid #e2e8f0; border-radius: 10px; background: white;
      text-align: left; font-size: 1rem; cursor: pointer; transition: all 0.2s;
    }
    .option-btn:hover { border-color: var(--primary); background: #f5f3ff; }
    
    /* Trạng thái đáp án khi được chọn */
    .option-btn.selected { border-color: var(--primary); background: #e0e7ff; font-weight: bold; }
    .option-btn.correct { border-color: var(--success); background: #d1fae5; color: #065f46; }
    .option-btn.wrong { border-color: var(--error); background: #fee2e2; color: #991b1b; }

    /* --- NÚT ĐIỀU HƯỚNG --- */
    .actions { display: flex; justify-content: flex-end; }
    .btn-next {
      padding: 12px 24px; background: var(--primary); color: white; border: none;
      border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn-next:hover { background: var(--primary-hover); }
    .btn-next:disabled { background: #cbd5e1; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- =========================================================
       1. KHU VỰC THÔNG TIN HỌ TÊN VÀ LỚP (TÙY CHỈNH TẠI ĐÂY)
  ========================================================= -->
  <div class="user-card">
    <div class="user-info">
      <!-- Thay đổi Họ tên và Lớp tại đây -->
      <h2 id="user-name">Họ và tên: Hồ Quốc Vương</h2>
      <p id="user-class">Lớp: Khóa học lập trình Data Science</p>
    </div>
    <div class="score-badge">
      Thứ tự: <span id="current-step-text">1</span>/<span id="total-steps-text">5</span>
    </div>
  </div>

  <!-- Tiến trình dạng Hành Trình (Roadmap) -->
  <div class="roadmap" id="roadmap-container">
    <!-- Cột mốc câu hỏi sẽ tự động sinh ra ở đây -->
  </div>

  <!-- =========================================================
       2. KHU VỰC CÂU HỎI VÀ ĐÁP ÁN
  ========================================================= -->
  <div id="quiz-box">
    <div class="question-title" id="question-text">Đang tải câu hỏi...</div>
    <div class="options-grid" id="options-container">
      <!-- Danh sách câu trả lời sẽ hiển thị tại đây -->
    </div>
    <div class="actions">
      <button class="btn-next" id="next-btn" onclick="nextQuestion()" disabled>Thách thức tiếp theo</button>
    </div>
  </div>

</div>

<script>
  // =========================================================
  // 3. ĐƯỜNG DẪN WEB APP (DÁN LINK GOOGLE APPS SCRIPT VÀO ĐÂY)
  // =========================================================
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwfu_GYJpkin4655KGvMW1C96HIR42QJs26A3web-7D0avwU3ZGD7sXcXkTREP0Tlek1g/exec";

  // =========================================================
  // 4. BỘ CÂU HỎI (DÁN / TÙY CHỈNH BỘ CÂU HỎI CỦA BẠN VÀO ĐÂY)
  // =========================================================
  const questions = [
    {
      id: 1,
      question: "Câu 1: Ngôn ngữ nào thường được dùng phổ biến nhất cho Data Science?",
      options: ["PHP", "Python", "HTML", "C++"],
      answer: 1 // Chỉ số của đáp án đúng (0: PHP, 1: Python, 2: HTML, 3: C++)
    },
    {
      id: 2,
      question: "Câu 2: Đâu là một hệ quản trị cơ sở dữ liệu quan hệ?",
      options: ["SQL Server", "CSS", "Photoshop", "NodeJS"],
      answer: 0
    },
    {
      id: 3,
      question: "Câu 3: Trong Google Apps Script, hàm nào dùng để ghi dữ liệu ra nhật ký?",
      options: ["console.print()", "System.out.println()", "Logger.log()", "echo()"],
      answer: 2
    }
    // Thêm các câu hỏi tiếp theo vào đây theo đúng định dạng trên...
  ];

  let currentQuestionIndex = 0;
  let selectedOptionIndex = null;
  let userAnswers = [];

  // Khởi tạo giao diện
  function initQuiz() {
    renderRoadmap();
    loadQuestion();
  }

  // Vẽ các cột mốc hành trình
  function renderRoadmap() {
    const roadmapEl = document.getElementById("roadmap-container");
    document.getElementById("total-steps-text").innerText = questions.length;
    roadmapEl.innerHTML = "";
    
    questions.forEach((_, idx) => {
      const step = document.createElement("div");
      step.className = `step ${idx === 0 ? 'active' : ''}`;
      step.id = `step-${idx}`;
      step.innerText = idx + 1;
      roadmapEl.appendChild(step);
    });
  }

  // Tải nội dung câu hỏi hiện tại
  function loadQuestion() {
    const currentQ = questions[currentQuestionIndex];
    document.getElementById("question-text").innerText = currentQ.question;
    document.getElementById("current-step-text").innerText = currentQuestionIndex + 1;
    document.getElementById("next-btn").disabled = true;
    selectedOptionIndex = null;

    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    currentQ.options.forEach((optText, index) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = optText;
      // Sự kiện khi người dùng click chọn đáp án
      btn.onclick = () => selectOption(index);
      optionsContainer.appendChild(btn);
    });

    updateRoadmapUI();
  }

  // =========================================================
  // 5. LOGIC TÙY CHỈNH KHI CHỌN ĐÁP ÁN (OPTION SELECTION)
  // =========================================================
  function selectOption(index) {
    selectedOptionIndex = index;
    const buttons = document.querySelectorAll(".option-btn");
    
    // Bỏ chọn tất cả các nút khác
    buttons.forEach((btn, idx) => {
      btn.classList.remove("selected");
      if (idx === index) {
        btn.classList.add("selected"); // Đánh dấu nút được chọn
      }
    });

    /* --- NẾU BẠN MUỐN HIỂN THỊ ĐÚNG/SAI NGAY LẬP TỨC (UNCOMMENT ĐOẠN DƯỚI) ---
    const correctIndex = questions[currentQuestionIndex].answer;
    buttons.forEach((btn, idx) => {
      btn.disabled = true; // Khóa không cho chọn lại
      if (idx === correctIndex) btn.classList.add("correct");
      if (idx === index && index !== correctIndex) btn.classList.add("wrong");
    });
    ------------------------------------------------------------------ */

    // Mở khóa nút Tiếp theo
    document.getElementById("next-btn").disabled = false;
  }

  // Chuyển sang câu hỏi tiếp theo
  function nextQuestion() {
    // Lưu kết quả của người dùng
    userAnswers.push({
      questionId: questions[currentQuestionIndex].id,
      selected: selectedOptionIndex
    });

    // Đánh dấu hoàn thành bước hiện tại trên Hành trình
    document.getElementById(`step-${currentQuestionIndex}`).classList.remove("active");
    document.getElementById(`step-${currentQuestionIndex}`).classList.add("completed");

    currentQuestionIndex++;

    if (currentQuestionIndex < questions.length) {
      loadQuestion();
    } else {
      finishQuiz();
    }
  }

  // Cập nhật trạng thái hiển thị của các bước trên Hành trình
  function updateRoadmapUI() {
    const currentStepEl = document.getElementById(`step-${currentQuestionIndex}`);
    if (currentStepEl) {
      currentStepEl.classList.add("active");
    }
  }

  // Hoàn thành bài trắc nghiệm
  function finishQuiz() {
    document.getElementById("quiz-box").innerHTML = `
      <div style="text-align: center; padding: 20px 0;">
        <h2 style="color: var(--success); margin-bottom: 10px;">🎉 Chúc mừng bạn đã hoàn thành hành trình!</h2>
        <p>Kết quả đã được ghi nhận vào hệ thống.</p>
      </div>
    `;

    // Gửi dữ liệu về Google Sheets thông qua Web App URL
    if (SCRIPT_URL && SCRIPT_URL !== "DÁN_LINK_WEB_APP_Ở_BƯỚC_1_VÀO_ĐÂY") {
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: "Hồ Quốc Vương",
          className: "Lớp Data Science",
          answers: userAnswers
        })
      });
    }
  }

  // Chạy ứng dụng khi trang web tải xong
  window.onload = initQuiz;
</script>

</body>
</html>
